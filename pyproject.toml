[project]
name = "sao-local"
version = "0.1.0"
description = "Local uv environment and launch tooling for the SAO reproduction"
requires-python = ">=3.12,<3.13"
dependencies = [
  "aiohttp>=3.10",
  "cmake>=3.30",
  "datasets>=4.0",
  "huggingface-hub[cli]>=0.34",
  "ninja>=1.11",
  "numpy<2",
  "packaging>=24.2",
  "psutil>=6",
  "pybind11>=2.13",
  "pytest>=8",
  "pyyaml>=6",
  "requests>=2.32",
  "setuptools>=77,<80",
  "setuptools-rust>=1.11",
  "wheel>=0.45",
]

[tool.uv]
package = false
link-mode = "copy"
